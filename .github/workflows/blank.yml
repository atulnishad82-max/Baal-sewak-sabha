name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -q "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -r baal-sewak-sabha-native-android/* .
          fi

      - name: Inject Original Image Logo
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          
          # यहाँ अपलोड किए गए माँ दुर्गा जी के ओरिजिनल लोगो (logo.png/logo.jpg/1003244085) को खोजा जा रहा है
          NEW_LOGO=$(find . -maxdepth 2 -iname "*logo*" -o -iname "*1003244085*" | head -n 1)
          if [ -n "$NEW_LOGO" ]; then
            echo "Injecting new logo from: $NEW_LOGO"
            # Drawable फ़ोल्डर में ऐप और स्प्लैश के लिए सेट करना
            cp "$NEW_LOGO" app/src/main/res/drawable/app_logo.png
            cp "$NEW_LOGO" app/src/main/res/drawable/app_logo.jpg
            
            # फ़ोन होम स्क्रीन के आइकॉन के लिए (सभी साइज़)
            for dir in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do
              cp "$NEW_LOGO" app/src/main/res/$dir/ic_launcher.png
              cp "$NEW_LOGO" app/src/main/res/$dir/ic_launcher_round.png
            done
          else
            echo "WARNING: Original Logo not found! Double check your upload."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Original-Logo-NewBuild
          path: "**/build/outputs/apk/debug/*.apk"
