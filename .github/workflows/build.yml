          EOF

          # 9. Toolchain Discovery
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ANDROID_JAR=$(find "$SDK_DIR/platforms" -name "android.jar" | sort -V | tail -n 1)
          BT_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          # 10. AAPT Package
          "$BT_DIR/aapt" package -f -m -J project/src -M project/AndroidManifest.xml -S project/res -I "$ANDROID_JAR" -F project/bin/unaligned.apk

          # 11. Java Compilation
          javac -source 1.8 -target 1.8 -d project/bin -cp "$ANDROID_JAR" $(find project/src -name "*.java")

          # 12. D8 DEX
          "$BT_DIR/d8" --output project/bin/ $(find project/bin -name "*.class")

          # 13. Add DEX into APK
          cd project/bin
          zip -u unaligned.apk classes.dex
          cd ../..

          # 14. Zipalign & Sign
          "$BT_DIR/zipalign" -f -p 4 project/bin/unaligned.apk project/bin/aligned.apk

          keytool -genkeypair -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=BaalSewakSabha, OU=App, O=Org, L=Amritsar, S=Punjab, C=IN"
          "$BT_DIR/apksigner" sign --ks test.keystore --ks-pass pass:123456 --out Baal-Sewak-Sabha-Ultra-Final.apk project/bin/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Ultra-Final-APK
          path: "Baal-Sewak-Sabha-Ultra-Final.apk"
