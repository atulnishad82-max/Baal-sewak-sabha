          cat << 'EOF' > project/src/com/baalsewaksabha/app/MainActivity.java
          package com.baalsewaksabha.app;

          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.content.res.Resources;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.DatePicker;
          import android.widget.EditText;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private EditText etMemberName, etMemberPhone, etAmount, etSearch;
              private Spinner spMonth, spPaymentMode;
              private TextView txtRecords, txtAnalytics, txtMemberChart;
              private Button btnPickDate;
              private SharedPreferences prefs;
              private File lastReceiptFile = null;
              private String lastReceiptCaption = "";
              private String lastIdCardText = "";
              private String selectedDateStr = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etSearch = (EditText) findViewById(R.id.etSearch);
                  etMemberName = (EditText) findViewById(R.id.etMemberName);
                  etMemberPhone = (EditText) findViewById(R.id.etMemberPhone);
                  etAmount = (EditText) findViewById(R.id.etAmount);
                  spMonth = (Spinner) findViewById(R.id.spMonth);
                  spPaymentMode = (Spinner) findViewById(R.id.spPaymentMode);
                  txtRecords = (TextView) findViewById(R.id.txtRecords);
                  txtAnalytics = (TextView) findViewById(R.id.txtAnalytics);
                  txtMemberChart = (TextView) findViewById(R.id.txtMemberChart);
                  btnPickDate = (Button) findViewById(R.id.btnPickDate);

                  Button btnSaveSewa = (Button) findViewById(R.id.btnSaveSewa);
                  Button btnSaveExpense = (Button) findViewById(R.id.btnSaveExpense);
                  Button btnShareReceipt = (Button) findViewById(R.id.btnShareReceipt);
                  Button btnWhatsappReminder = (Button) findViewById(R.id.btnWhatsappReminder);
                  Button btnShareId = (Button) findViewById(R.id.btnShareId);
                  Button btnShowChart = (Button) findViewById(R.id.btnShowChart);
                  Button btnShareAllReport = (Button) findViewById(R.id.btnShareAllReport);
                  Button btnCallHelpline = (Button) findViewById(R.id.btnCallHelpline);
                  Button btnLangHi = (Button) findViewById(R.id.btnLangHi);
                  Button btnLangEn = (Button) findViewById(R.id.btnLangEn);

                  prefs = getSharedPreferences("SewaSabhaAccountsV8", Context.MODE_PRIVATE);

                  selectedDateStr = new SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(new Date());
                  btnPickDate.setText("तारीख: " + selectedDateStr);

                  String[] months = {
                      "January / जनवरी", "February / फ़रवरी", "March / मार्च",
                      "April / अप्रैल", "May / जून", "June / जून",
                      "July / जुलाई", "August / अगस्त", "September / सितम्बर",
                      "October / अक्टूबर", "November / नवम्बर", "December / दिसम्बर"
                  };
                  ArrayAdapter<String> adapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, months);
                  spMonth.setAdapter(adapter);

                  String[] paymentModes = {
                      "नकद (Cash)", "गूगल पे / यूपीआई (GPay/UPI)", "पेटीएम (Paytm)", "बैंक ट्रांसफर (Bank Transfer)"
                  };
                  ArrayAdapter<String> modeAdapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, paymentModes);
                  spPaymentMode.setAdapter(modeAdapter);

                  loadRecords("");

                  btnPickDate.setOnClickListener(v -> showDatePicker());
                  btnSaveSewa.setOnClickListener(v -> saveRecord(false));
                  btnSaveExpense.setOnClickListener(v -> saveRecord(true));
                  btnShareReceipt.setOnClickListener(v -> shareColourfulPhotoReceipt());
                  btnWhatsappReminder.setOnClickListener(v -> sendReminder());
                  btnShareId.setOnClickListener(v -> shareIdCard());
                  btnShowChart.setOnClickListener(v -> showMemberChart());
                  btnShareAllReport.setOnClickListener(v -> shareFullReport());
                  btnCallHelpline.setOnClickListener(v -> callAdmin());

                  btnLangHi.setOnClickListener(v -> setAppLocale("hi"));
                  btnLangEn.setOnClickListener(v -> setAppLocale("en"));

                  etSearch.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          loadRecords(s.toString().trim());
                      }
                      @Override
                      public void afterTextChanged(Editable s) {}
                  });
              }

              private void showDatePicker() {
                  Calendar c = Calendar.getInstance();
                  int y = c.get(Calendar.YEAR);
                  int m = c.get(Calendar.MONTH);
                  int d = c.get(Calendar.DAY_OF_MONTH);

                  DatePickerDialog dp = new DatePickerDialog(this, (view, year, month, dayOfMonth) -> {
                      selectedDateStr = String.format(Locale.getDefault(), "%02d-%02d-%04d", dayOfMonth, month + 1, year);
                      btnPickDate.setText("तारीख: " + selectedDateStr);
                  }, y, m, d);
                  dp.show();
              }

              private void setAppLocale(String langCode) {
                  Locale locale = new Locale(langCode);
                  Locale.setDefault(locale);
                  Resources res = getResources();
                  Configuration config = res.getConfiguration();
                  config.locale = locale;
                  res.updateConfiguration(config, res.getDisplayMetrics());
                  recreate();
              }

              private void callAdmin() {
                  Intent intent = new Intent(Intent.ACTION_DIAL);
                  intent.setData(Uri.parse("tel:9780475164"));
                  startActivity(intent);
              }

              private void saveRecord(boolean isExpense) {
                  String name = etMemberName.getText().toString().trim();
                  String phone = etMemberPhone.getText().toString().trim();
                  String amtStr = etAmount.getText().toString().trim();
                  String month = spMonth.getSelectedItem().toString();
                  String mode = spPaymentMode.getSelectedItem().toString();

                  if (name.isEmpty() || amtStr.isEmpty()) {
                      Toast.makeText(this, "कृपया नाम और राशि भरें!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  int amount = 0;
                  try {
                      amount = Integer.parseInt(amtStr);
                  } catch (Exception ignored) {}

                  int sewaTotal = prefs.getInt("sewa_total", 0);
                  int expenseTotal = prefs.getInt("expense_total", 0);
                  int entryCount = prefs.getInt("entry_count", 0) + 1;
                  String existingGeneral = prefs.getString("records", "");

                  String newGeneralEntry;
                  if (isExpense) {
                      expenseTotal += amount;
                      newGeneralEntry = "🔻 [खर्च] " + name + "\n  राशि: ₹" + amount + " [" + mode + "] | " + selectedDateStr + "\n\n";
                      Toast.makeText(this, "खर्च दर्ज हो गया!", Toast.LENGTH_SHORT).show();
                  } else {
                      sewaTotal += amount;
                      newGeneralEntry = "🟢 [सेवा] " + name + " (" + (phone.isEmpty() ? "N/A" : phone) + ")\n  " + month + " | ₹" + amount + " [" + mode + "] | " + selectedDateStr + "\n\n";

                      String memberKey = "CHART_" + name.toLowerCase().replaceAll("\\s+", "");
                      String memberHistory = prefs.getString(memberKey, "");
                      int memberTotal = prefs.getInt("TOTAL_" + memberKey, 0) + amount;
                      String newChartRow = "📅 " + selectedDateStr + " | " + month + " | ₹" + amount + " (" + mode + ")\n";

                      prefs.edit()
                              .putString(memberKey, newChartRow + memberHistory)
                              .putInt("TOTAL_" + memberKey, memberTotal)
                              .apply();

                      String recNo = "BSS-2026-" + entryCount;
