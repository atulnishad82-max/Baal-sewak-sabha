              private void generateColourfulReceiptBitmap(String recNo, String name, String phone, String month, String mode, String amount, String date) {
                  try {
                      int width = 850;
                      int height = 1200;
                      Bitmap bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(bitmap);

                      // 1. Rich Background
                      Paint bgPaint = new Paint();
                      bgPaint.setShader(new LinearGradient(0, 0, 0, height, Color.parseColor("#FFFDF5"), Color.parseColor("#FFF0DE"), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, width, height, bgPaint);

                      // 2. Double Ornamental Borders (Gold & Royal Crimson)
                      Paint goldPaint = new Paint();
                      goldPaint.setColor(Color.parseColor("#D4AF37"));
                      goldPaint.setStyle(Paint.Style.STROKE);
                      goldPaint.setStrokeWidth(14);
                      canvas.drawRoundRect(new RectF(18, 18, width - 18, height - 18), 32, 32, goldPaint);

                      Paint redBorder = new Paint();
                      redBorder.setColor(Color.parseColor("#B71C1C"));
                      redBorder.setStyle(Paint.Style.STROKE);
                      redBorder.setStrokeWidth(5);
                      canvas.drawRoundRect(new RectF(34, 34, width - 34, height - 34), 22, 22, redBorder);

                      // 3. Header Crimson Banner
                      Paint bannerPaint = new Paint();
                      bannerPaint.setColor(Color.parseColor("#B71C1C"));
                      bannerPaint.setStyle(Paint.Style.FILL);
                      canvas.drawRoundRect(new RectF(50, 50, width - 50, 175), 18, 18, bannerPaint);

                      // 4. Logo Draw in Center
                      Bitmap logoBitmap = BitmapFactory.decodeResource(getResources(), R.drawable.ic_launcher);
                      if (logoBitmap != null) {
                          Bitmap scaledLogo = Bitmap.createScaledBitmap(logoBitmap, 130, 130, true);
                          canvas.drawBitmap(scaledLogo, (width - 130) / 2, 190, null);
                      }

                      Paint textPaint = new Paint();
                      textPaint.setAntiAlias(true);

                      // Banner Headings
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setColor(Color.parseColor("#FFD700"));
                      textPaint.setTextSize(36);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText("🚩 बाल सेवक सभा (रजि.) 🚩", width / 2, 110, textPaint);

                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextSize(20);
                      textPaint.setFakeBoldText(false);
                      canvas.drawText("हिन्दुस्तानी बस्ती, अमृतसर (पंजाब) - 143001", width / 2, 150, textPaint);

                      // Title Sub-card
                      textPaint.setColor(Color.parseColor("#1B5E20"));
                      textPaint.setTextSize(28);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText("★ आधिकारिक डिजिटल सेवा रसीद ★", width / 2, 360, textPaint);

                      textPaint.setColor(Color.parseColor("#666666"));
                      textPaint.setTextSize(19);
                      textPaint.setFakeBoldText(false);
                      canvas.drawText("रसीद संख्या: " + recNo + "  |  तारीख: " + date, width / 2, 395, textPaint);

                      // White Info Card Container
                      Paint cardBg = new Paint();
                      cardBg.setColor(Color.WHITE);
                      cardBg.setStyle(Paint.Style.FILL);
                      canvas.drawRoundRect(new RectF(60, 425, width - 60, 835), 24, 24, cardBg);

                      Paint cardBorder = new Paint();
                      cardBorder.setColor(Color.parseColor("#E6D7B8"));
                      cardBorder.setStyle(Paint.Style.STROKE);
                      cardBorder.setStrokeWidth(3);
                      canvas.drawRoundRect(new RectF(60, 425, width - 60, 835), 24, 24, cardBorder);

                      // Table rows
                      textPaint.setTextAlign(Paint.Align.LEFT);
                      int startX = 90;
                      int y = 490;
                      int rowGap = 65;

                      // Member Name
                      textPaint.setColor(Color.parseColor("#555555"));
                      textPaint.setTextSize(22);
                      canvas.drawText("सदस्य का नाम :", startX, y, textPaint);
                      textPaint.setColor(Color.parseColor("#B71C1C"));
                      textPaint.setTextSize(25);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText(name.toUpperCase(), startX + 180, y, textPaint);

                      // Mobile
                      y += rowGap;
                      textPaint.setColor(Color.parseColor("#555555"));
                      textPaint.setTextSize(22);
                      textPaint.setFakeBoldText(false);
                      canvas.drawText("मोबाइल नंबर   :", startX, y, textPaint);
                      textPaint.setColor(Color.BLACK);
                      textPaint.setTextSize(23);
                      canvas.drawText(phone, startX + 180, y, textPaint);

                      // Month
                      y += rowGap;
                      textPaint.setColor(Color.parseColor("#555555"));
                      textPaint.setTextSize(22);
                      canvas.drawText("माह / सेवा     :", startX, y, textPaint);
                      textPaint.setColor(Color.parseColor("#0D47A1"));
                      textPaint.setTextSize(23);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText(month, startX + 180, y, textPaint);

                      // Mode
                      y += rowGap;
                      textPaint.setColor(Color.parseColor("#555555"));
                      textPaint.setTextSize(22);
                      textPaint.setFakeBoldText(false);
                      canvas.drawText("भुगतान माध्यम :", startX, y, textPaint);
                      textPaint.setColor(Color.parseColor("#2E7D32"));
                      textPaint.setTextSize(23);
                      canvas.drawText(mode, startX + 180, y, textPaint);

                      // Highlight Amount Box
                      y += rowGap;
                      Paint amtBox = new Paint();
                      amtBox.setColor(Color.parseColor("#E8F5E9"));
                      canvas.drawRoundRect(new RectF(startX - 10, y - 42, width - 80, y + 25), 14, 14, amtBox);

                      textPaint.setColor(Color.parseColor("#1B5E20"));
                      textPaint.setTextSize(28);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText("सेवा राशि :  ₹ " + amount + " /- (स्वीकृत)", startX + 15, y, textPaint);

                      // Official Green Verified Stamp
                      Paint stampCircle = new Paint();
                      stampCircle.setColor(Color.parseColor("#2E7D32"));
                      stampCircle.setStyle(Paint.Style.STROKE);
                      stampCircle.setStrokeWidth(5);
                      canvas.drawCircle(width - 165, 730, 55, stampCircle);

                      Paint stampText = new Paint();
                      stampText.setColor(Color.parseColor("#2E7D32"));
                      stampText.setTextSize(24);
                      stampText.setFakeBoldText(true);
                      stampText.setTextAlign(Paint.Align.CENTER);
                      canvas.drawText("PAID", width - 165, 726, stampText);
                      stampText.setTextSize(13);
                      canvas.drawText("VERIFIED", width - 165, 748, stampText);

                      // Footer Authority
                      textPaint.setTextAlign(Paint.Align.LEFT);
                      textPaint.setColor(Color.parseColor("#1B5E20"));
                      textPaint.setTextSize(23);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText("व्यवस्थापक : अतुल (सुपुत्र: श्री राज कुमार)", 80, 910, textPaint);
                      textPaint.setColor(Color.parseColor("#555555"));
                      textPaint.setTextSize(20);
                      textPaint.setFakeBoldText(false);
                      canvas.drawText("हेल्पलाइन    : +91 97804-75164", 80, 950, textPaint);

                      // Blessings & Disclaimer
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setColor(Color.parseColor("#B71C1C"));
                      textPaint.setTextSize(28);
                      textPaint.setFakeBoldText(true);
                      canvas.drawText("॥ जय माता दी ॥", width / 2, 1050, textPaint);

                      textPaint.setColor(Color.parseColor("#777777"));
                      textPaint.setTextSize(16);
                      textPaint.setFakeBoldText(false);
                      canvas.drawText("यह एक अधिकृत कम्प्यूटरीकृत डिजिटल रसीद है।", width / 2, 1090, textPaint);

                      // Save to app cache
                      File cacheDir = getCacheDir();
                      lastReceiptFile = new File(cacheDir, "baal_sewak_receipt.png");
                      FileOutputStream fos = new FileOutputStream(lastReceiptFile);
                      bitmap.compress(Bitmap.CompressFormat.PNG, 100, fos);
                      fos.flush();
                      fos.close();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void showMemberChart() {
                  String name = etMemberName.getText().toString().trim();
                  if (name.isEmpty()) {
                      Toast.makeText(this, "चार्ट देखने के लिए सदस्य का नाम लिखें!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String memberKey = "CHART_" + name.toLowerCase().replaceAll("\\s+", "");
                  String history = prefs.getString(memberKey, "");
                  int total = prefs.getInt("TOTAL_" + memberKey, 0);

                  if (history.isEmpty()) {
                      txtMemberChart.setText("सदस्य: " + name + "\nकोई सेवा चार्ट रिकॉर्ड नहीं मिला।");
                  } else {
                      txtMemberChart.setText("🚩 सदस्य सेवा चार्ट: " + name.toUpperCase() + "\nकुल सेवा: ₹" + total + "\n-----------------------------------\n" + history);
                  }
              }

              private void loadRecords(String query) {
                  String rawRecords = prefs.getString("records", "अभी कोई रिकॉर्ड मौजूद नहीं है।");
                  int sewa = prefs.getInt("sewa_total", 0);
                  int expense = prefs.getInt("expense_total", 0);
                  int balance = sewa - expense;
                  int count = prefs.getInt("entry_count", 0);

                  txtAnalytics.setText("📊 कुल सेवा: ₹" + sewa + " | कुल खर्च: ₹" + expense + "\n💰 शेष बैलेंस: ₹" + balance + " | कुल एंट्रीज: " + count);

                  if (query.isEmpty() || rawRecords.equals("अभी कोई रिकॉर्ड मौजूद नहीं है।")) {
                      txtRecords.setText(rawRecords);
                      return;
                  }

                  StringBuilder filtered = new StringBuilder();
                  String[] items = rawRecords.split("\n\n");
                  for (String item : items) {
                      if (item.toLowerCase().contains(query.toLowerCase())) {
                          filtered.append(item).append("\n\n");
                      }
                  }

                  if (filtered.length() == 0) {
                      txtRecords.setText("'" + query + "' के लिए कोई रिकॉर्ड नहीं मिला।");
                  } else {
                      txtRecords.setText(filtered.toString());
                  }
              }

              private void shareColourfulPhotoReceipt() {
                  if (lastReceiptFile == null || !lastReceiptFile.exists()) {
                      Toast.makeText(this, "पहले सदस्य की सेवा दर्ज करें ताकि रसीद बने!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  try {
                      Uri imageUri = Uri.parse("content://com.baalsewaksabha.app.provider/baal_sewak_receipt.png");
                      Intent shareIntent = new Intent(Intent.ACTION_SEND);
                      shareIntent.setType("image/png");
                      shareIntent.putExtra(Intent.EXTRA_STREAM, imageUri);
                      shareIntent.putExtra(Intent.EXTRA_TEXT, lastReceiptCaption);
                      shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(shareIntent, "रंग-बिरंगी रसीद भेजें (WhatsApp)"));
                  } catch (Exception e) {
                      Toast.makeText(this, "फोटो शेयर करने में समस्या आई!", Toast.LENGTH_SHORT).show();
                  }
              }

