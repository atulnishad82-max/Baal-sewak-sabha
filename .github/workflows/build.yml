          # 6. Standalone Provider Class
          cat << 'EOF' > project/src/com/baalsewaksabha/app/SabhaFileProvider.java
          package com.baalsewaksabha.app;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;
          import android.provider.OpenableColumns;
          import java.io.File;
          import java.io.FileNotFoundException;

          public class SabhaFileProvider extends ContentProvider {
              @Override
              public boolean onCreate() {
                  return true;
              }

              @Override
              public ParcelFileDescriptor openFile(Uri uri, String mode) throws FileNotFoundException {
                  File file = new File(getContext().getCacheDir(), uri.getLastPathSegment());
                  if (file.exists()) {
                      return ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY);
                  }
                  throw new FileNotFoundException("File not found: " + uri.toString());
              }

              @Override
              public String getType(Uri uri) {
                  return "image/png";
              }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection, String[] selectionArgs, String sortOrder) {
                  File file = new File(getContext().getCacheDir(), uri.getLastPathSegment());
                  MatrixCursor cursor = new MatrixCursor(new String[]{OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE});
                  cursor.addRow(new Object[]{file.getName(), file.length()});
                  return cursor;
              }

              @Override public Uri insert(Uri uri, ContentValues values) { return null; }
              @Override public int delete(Uri uri, String selection, String[] selectionArgs) { return 0; }
              @Override public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs) { return 0; }
          }
          EOF

          # 7. Apply Logo
          LOGO=$(find . -maxdepth 2 \( -iname "*1003244085*" -o -iname "*logo*" -o -iname "*.jpg" -o -iname "*.png" \) ! -path "./.git/*" -type f | head -n 1)
          if [ -n "$LOGO" ]; then
            cp -f "$LOGO" project/res/drawable/ic_launcher.png
          fi

