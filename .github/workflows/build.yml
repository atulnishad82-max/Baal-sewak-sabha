name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip -qo "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -rf baal-sewak-sabha-native-android/* .
          fi

      - name: Inject Admin Details, Monthly Sewa and Logo
        run: |
          # 1. Asli Durga Mata Logo Set Karna
          LOGO=$(find . -maxdepth 2 \( -iname "*logo*" -o -iname "*1003244085*" \) -type f | head -n 1)
          if [ -n "$LOGO" ]; then
            mkdir -p app/src/main/res/drawable
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.png || true
            rm -rf app/src/main/res/mipmap-anydpi*
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/src/main/res/$d
              cp -f "$LOGO" app/src/main/res/$d/ic_launcher.png || true
              cp -f "$LOGO" app/src/main/res/$d/ic_launcher_round.png || true
            done
          fi

          # 2. Screens.kt ko naye features (Monthly Sewa, Receipt aur Permanent Admin) ke sath update karna
          SCREEN_PATH=$(find app/src/main/java -name "Screens.kt" | head -n 1)
          if [ -n "$SCREEN_PATH" ]; then
            cat << 'EOF' > "$SCREEN_PATH"
