name: Build Ultra Advance Baal Sewak Sabha App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Standalone APK Direct
        run: |
          set -e

          mkdir -p project/src/com/baalsewaksabha/app
          mkdir -p project/res/layout
          mkdir -p project/res/values
          mkdir -p project/res/values-hi
          mkdir -p project/res/drawable
          mkdir -p project/res/xml
          mkdir -p project/bin

          # File Provider XML
          cat << 'EOF' > project/res/xml/provider_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_receipts" path="." />
          </paths>
          EOF

          # Strings English
          cat << 'EOF' > project/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Baal Sewak Sabha</string>
              <string name="org_title">🚩 Baal Sewak Sabha (Regd.) 🚩</string>
              <string name="org_sub">Hindustani Basti, Amritsar (Punjab) - 143001</string>
              <string name="admin_info">Vyavasthapak: Atul (S/o Raj Kumar) | Helpline: 97804-75164</string>
              <string name="search_hint">Search Member by Name or Mobile...</string>
              <string name="member_name">Member Full Name / Expense Reason</string>
              <string name="member_phone">Mobile Number</string>
              <string name="amount">Amount (₹)</string>
              <string name="select_date">Change Date (DD-MM-YYYY)</string>
              <string name="btn_add_sewa">Save Sewa Entry</string>
              <string name="btn_add_expense">Save Sabha Expense</string>
              <string name="btn_share_receipt">Share Colourful Photo Receipt</string>
              <string name="btn_whatsapp_reminder">Send WhatsApp Reminder</string>
              <string name="btn_show_chart">Show Member Full Chart</string>
              <string name="btn_share_id">Share Member ID Card</string>
              <string name="btn_share_all_report">Export Full Audit Report</string>
              <string name="btn_call_helpline">Call Admin Helpline</string>
              <string name="chart_title">Member Date-wise Sewa Record</string>
              <string name="records_title">Complete Register &amp; Accounts</string>
          </resources>
          EOF

          # Strings Hindi
          cat << 'EOF' > project/res/values-hi/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">बाल सेवक सभा</string>
              <string name="org_title">🚩 बाल सेवक सभा (रजि.) 🚩</string>
              <string name="org_sub">हिन्दुस्तानी बस्ती, अमृतसर (पंजाब) - 143001</string>
              <string name="admin_info">व्यवस्थापक: अतुल (सुपुत्र: श्री राज कुमार) | संपर्क: 97804-75164</string>
              <string name="search_hint">सदस्य का नाम या मोबाइल खोजें...</string>
              <string name="member_name">सदस्य का नाम / खर्च का विवरण</string>
              <string name="member_phone">मोबाइल नंबर</string>
              <string name="amount">राशि (₹)</string>
              <string name="select_date">तारीख बदलें (DD-MM-YYYY)</string>
              <string name="btn_add_sewa">सेवा दर्ज करें व रसीद बनाएं</string>
              <string name="btn_add_expense">सभा का खर्च दर्ज करें</string>
              <string name="btn_share_receipt">रंग-बिरंगी फोटो रसीद शेयर करें (WhatsApp)</string>
              <string name="btn_whatsapp_reminder">व्हाट्सएप सेवा स्मरण भेजें</string>
              <string name="btn_show_chart">सदस्य का फुल सेवा चार्ट देखें</string>
              <string name="btn_share_id">डिजिटल सदस्यता पहचान पत्र भेजें</string>
              <string name="btn_share_all_report">संपूर्ण सेवा व खर्च रिपोर्ट एक्सपोर्ट करें</string>
              <string name="btn_call_helpline">व्यवस्थापक हेल्पलाइन पर कॉल करें</string>
              <string name="chart_title">सदस्य का तारीखवार सेवा रिकॉर्ड</string>
              <string name="records_title">संपूर्ण बहीखाता एवं सेवा रजिस्टर</string>
          </resources>
          EOF

          # Layout
          cat << 'EOF' > project/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FCF8F5">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:gravity="center_horizontal">

                  <ImageView
                      android:id="@+id/imgLogo"
                      android:layout_width="105dp"
                      android:layout_height="105dp"
                      android:src="@drawable/ic_launcher"
                      android:scaleType="fitCenter" />

                  <TextView
                      android:id="@+id/txtOrgTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/org_title"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:textColor="#B71C1C"
                      android:gravity="center"
                      android:layout_marginTop="8dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/org_sub"
                      android:textSize="13sp"
                      android:textColor="#424242"
                      android:gravity="center" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/admin_info"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:textColor="#1B5E20"
                      android:gravity="center"
                      android:layout_marginTop="4dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginTop="10dp">
                      <Button
                          android:id="@+id/btnLangHi"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:text="हिंदी"
                          android:textSize="12sp"
                          android:layout_marginEnd="8dp" />
                      <Button
                          android:id="@+id/btnLangEn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:text="English"
                          android:textSize="12sp"
                          android:layout_marginEnd="8dp" />
                      <Button
                          android:id="@+id/btnCallHelpline"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:text="📞 Call"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/txtAnalytics"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="कुल सेवा: ₹0 | खर्च: ₹0\nशेष बैलेंस: ₹0"
                      android:background="#FFF3E0"
                      android:textColor="#BF360C"
                      android:textStyle="bold"
                      android:padding="12dp"
                      android:gravity="center"
                      android:layout_marginTop="12dp" />

                  <EditText
                      android:id="@+id/etSearch"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/search_hint"
                      android:background="#FFFFFF"
                      android:padding="10dp"
                      android:layout_marginTop="10dp" />

                  <EditText
                      android:id="@+id/etMemberName"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/member_name"
                      android:layout_marginTop="10dp" />

                  <EditText
                      android:id="@+id/etMemberPhone"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/member_phone"
                      android:inputType="phone"
                      android:layout_marginTop="6dp" />

                  <Spinner
                      android:id="@+id/spMonth"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginTop="6dp" />

                  <Spinner
                      android:id="@+id/spPaymentMode"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnPickDate"
                      android:layout_width="match_parent"
                      android:layout_height="42dp"
                      android:text="@string/select_date"
                      android:layout_marginTop="6dp" />

                  <EditText
                      android:id="@+id/etAmount"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/amount"
                      android:inputType="number"
                      android:layout_marginTop="6dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginTop="10dp">
                      <Button
                          android:id="@+id/btnSaveSewa"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="@string/btn_add_sewa"
                          android:layout_marginEnd="4dp" />
                      <Button
                          android:id="@+id/btnSaveExpense"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="@string/btn_add_expense"
                          android:layout_marginStart="4dp" />
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnShareReceipt"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_share_receipt"
                      android:background="#D32F2F"
                      android:textColor="#FFFFFF"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnWhatsappReminder"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_whatsapp_reminder"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnShareId"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_share_id"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnShowChart"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_show_chart"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnShareAllReport"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_share_all_report"
                      android:layout_marginTop="6dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/chart_title"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      android:textColor="#1B5E20"
                      android:layout_marginTop="18dp" />

                  <TextView
                      android:id="@+id/txtMemberChart"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="सदस्य का नाम लिखकर 'Show Member Full Chart' दबाएं।"
                      android:padding="12dp"
                      android:background="#E8F5E9"
                      android:textColor="#1B5E20"
                      android:textStyle="bold"
                      android:layout_marginTop="6dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/records_title"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      android:textColor="#B71C1C"
                      android:layout_marginTop="20dp" />

                  <TextView
                      android:id="@+id/txtRecords"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="अभी कोई रिकॉर्ड मौजूद नहीं है।"
                      android:padding="12dp"
                      android:background="#EFEBE9"
                      android:layout_marginTop="8dp" />
              </LinearLayout>
          </ScrollView>
          EOF

          # Manifest
          cat << 'EOF' > project/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.baalsewaksabha.app"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Logo Attach
          LOGO=$(find . -maxdepth 2 \( -iname "*1003244085*" -o -iname "*logo*" -o -iname "*.jpg" -o -iname "*.png" \) ! -path "./.git/*" -type f | head -n 1)
          if [ -n "$LOGO" ]; then
            cp -f "$LOGO" project/res/drawable/ic_launcher.png
          fi

          # MainActivity Java with Colourful Graphics Generator
          cat << 'EOF' > project/src/com/baalsewaksabha/app/MainActivity.java
          package com.baalsewaksabha.app;

          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.content.res.Resources;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.DatePicker;
          import android.widget.EditText;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private EditText etMemberName, etMemberPhone, etAmount, etSearch;
              private Spinner spMonth, spPaymentMode;
              private TextView txtRecords, txtAnalytics, txtMemberChart;
              private Button btnPickDate;
              private SharedPreferences prefs;
              private File lastReceiptFile = null;
              private String lastReceiptText = "";
              private String lastIdCardText = "";
              private String selectedDateStr = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etSearch = (EditText) findViewById(R.id.etSearch);
                  etMemberName = (EditText) findViewById(R.id.etMemberName);
                  etMemberPhone = (EditText) findViewById(R.id.etMemberPhone);
                  etAmount = (EditText) findViewById(R.id.etAmount);
                  spMonth = (Spinner) findViewById(R.id.spMonth);
                  spPaymentMode = (Spinner) findViewById(R.id.spPaymentMode);
                  txtRecords = (TextView) findViewById(R.id.txtRecords);
                  txtAnalytics = (TextView) findViewById(R.id.txtAnalytics);
                  txtMemberChart = (TextView) findViewById(R.id.txtMemberChart);
                  btnPickDate = (Button) findViewById(R.id.btnPickDate);

                  Button btnSaveSewa = (Button) findViewById(R.id.btnSaveSewa);
                  Button btnSaveExpense = (Button) findViewById(R.id.btnSaveExpense);
                  Button btnShareReceipt = (Button) findViewById(R.id.btnShareReceipt);
                  Button btnWhatsappReminder = (Button) findViewById(R.id.btnWhatsappReminder);
                  Button btnShareId = (Button) findViewById(R.id.btnShareId);
                  Button btnShowChart = (Button) findViewById(R.id.btnShowChart);
                  Button btnShareAllReport = (Button) findViewById(R.id.btnShareAllReport);
                  Button btnCallHelpline = (Button) findViewById(R.id.btnCallHelpline);
                  Button btnLangHi = (Button) findViewById(R.id.btnLangHi);
                  Button btnLangEn = (Button) findViewById(R.id.btnLangEn);

                  prefs = getSharedPreferences("SewaSabhaAccountsV7", Context.MODE_PRIVATE);

                  selectedDateStr = new SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(new Date());
                  btnPickDate.setText("तारीख: " + selectedDateStr);

                  String[] months = {
                      "January / जनवरी", "February / फ़रवरी", "March / मार्च",
                      "April / अप्रैल", "May / मई", "June / जून",
                      "July / जुलाई", "August / अगस्त", "September / सितम्बर",
                      "October / अक्टूबर", "November / नवम्बर", "December / दिसम्बर"
                  };
                  ArrayAdapter<String> adapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, months);
                  spMonth.setAdapter(adapter);

                  String[] paymentModes = {
                      "नकद (Cash)", "गूगल पे / यूपीआई (GPay/UPI)", "पेटीएम (Paytm)", "बैंक ट्रांसफर (Bank Transfer)"
                  };
                  ArrayAdapter<String> modeAdapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, paymentModes);
                  spPaymentMode.setAdapter(modeAdapter);

                  loadRecords("");

                  btnPickDate.setOnClickListener(v -> showDatePicker());
                  btnSaveSewa.setOnClickListener(v -> saveRecord(false));
                  btnSaveExpense.setOnClickListener(v -> saveRecord(true));
                  btnShareReceipt.setOnClickListener(v -> shareColourfulReceipt());
                  btnWhatsappReminder.setOnClickListener(v -> sendReminder());
                  btnShareId.setOnClickListener(v -> shareIdCard());
                  btnShowChart.setOnClickListener(v -> showMemberChart());
                  btnShareAllReport.setOnClickListener(v -> shareFullReport());
                  btnCallHelpline.setOnClickListener(v -> callAdmin());

                  btnLangHi.setOnClickListener(v -> setAppLocale("hi"));
                  btnLangEn.setOnClickListener(v -> setAppLocale("en"));

                  etSearch.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          loadRecords(s.toString().trim());
                      }
                      @Override
                      public void afterTextChanged(Editable s) {}
                  });
              }

              private void showDatePicker() {
                  Calendar c = Calendar.getInstance();
                  int y = c.get(Calendar.YEAR);
                  int m = c.get(Calendar.MONTH);
                  int d = c.get(Calendar.DAY_OF_MONTH);

                  DatePickerDialog dp = new DatePickerDialog(this, (view, year, month, dayOfMonth) -> {
                      selectedDateStr = String.format(Locale.getDefault(), "%02d-%02d-%04d", dayOfMonth, month + 1, year);
                      btnPickDate.setText("तारीख: " + selectedDateStr);
                  }, y, m, d);
                  dp.show();
              }

              private void setAppLocale(String langCode) {
                  Locale locale = new Locale(langCode);
                  Locale.setDefault(locale);
                  Resources res = getResources();
                  Configuration config = res.getConfiguration();
                  config.locale = locale;
                  res.updateConfiguration(config, res.getDisplayMetrics());
                  recreate();
              }

              private void callAdmin() {
                  Intent intent = new Intent(Intent.ACTION_DIAL);
                  intent.setData(Uri.parse("tel:9780475164"));
                  startActivity(intent);
              }

              private void saveRecord(boolean isExpense) {
                  String name = etMemberName.getText().toString().trim();
                  String phone = etMemberPhone.getText().toString().trim();
                  String amtStr = etAmount.getText().toString().trim();
                  String month = spMonth.getSelectedItem().toString();
                  String mode = spPaymentMode.getSelectedItem().toString();

                  if (name.isEmpty() || amtStr.isEmpty()) {
                      Toast.makeText(this, "कृपया नाम/विवरण और राशि भरें!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  int amount = 0;
                  try {
                      amount = Integer.parseInt(amtStr);
                  } catch (Exception ignored) {}

                  int sewaTotal = prefs.getInt("sewa_total", 0);
                  int expenseTotal = prefs.getInt("expense_total", 0);
                  int entryCount = prefs.getInt("entry_count", 0) + 1;
                  String existingGeneral = prefs.getString("records", "");

                  String newGeneralEntry;
                  if (isExpense) {
                      expenseTotal += amount;
                      newGeneralEntry = "🔻 [खर्च] " + name + "\n  राशि: ₹" + amount + " [" + mode + "] | " + selectedDateStr + "\n\n";
                      Toast.makeText(this, "खर्च दर्ज हो गया!", Toast.LENGTH_SHORT).show();
                  } else {
                      sewaTotal += amount;
                      newGeneralEntry = "🟢 [सेवा] " + name + " (" + (phone.isEmpty() ? "N/A" : phone) + ")\n  " + month + " | ₹" + amount + " [" + mode + "] | " + selectedDateStr + "\n\n";

                      String memberKey = "CHART_" + name.toLowerCase().replaceAll("\\s+", "");
                      String memberHistory = prefs.getString(memberKey, "");
                      int memberTotal = prefs.getInt("TOTAL_" + memberKey, 0) + amount;
                      String newChartRow = "📅 " + selectedDateStr + " | " + month + " | ₹" + amount + " (" + mode + ")\n";

                      prefs.edit()
                              .putString(memberKey, newChartRow + memberHistory)
                              .putInt("TOTAL_" + memberKey, memberTotal)
                              .apply();

                      String recNo = "BSS-2026-" + entryCount;
                      lastReceiptText = "🚩 बाल सेवक सभा (रजि.) 🚩\n" +
                              "हिन्दुस्तानी बस्ती, अमृतसर (पंजाब) - 143001\n" +
                              "----------------------------------------\n" +
                              "📜 आधिकारिक डिजिटल सेवा रसीद 📜\n" +
                              "----------------------------------------\n" +
                              "रसीद संख्या    : " + recNo + "\n" +
                              "सदस्य का नाम   : " + name + "\n" +
                              "मोबाइल नंबर     : " + (phone.isEmpty() ? "N/A" : phone) + "\n" +
                              "माह / सेवा       : " + month + "\n" +
                              "भुगतान माध्यम   : " + mode + "\n" +
                              "सेवा राशि        : ₹" + amount + " /- (स्वीकृत)\n" +
                              "सेवा तारीख       : " + selectedDateStr + "\n" +
                              "----------------------------------------\n" +
                              "व्यवस्थापक      : अतुल (सुपुत्र: श्री राज कुमार)\n" +
                              "हेल्पलाइन        : +91 97804-75164\n" +
                              "----------------------------------------\n" +
                              "॥ जय माता दी ॥";

                      generateColourfulReceipt(recNo, name, (phone.isEmpty() ? "N/A" : phone), month, mode, String.valueOf(amount), selectedDateStr);

                      int idHash = name.hashCode() > 0 ? name.hashCode() % 10000 : (-name.hashCode()) % 10000;
                      lastIdCardText = "🚩 बाल सेवक सभा (रजि.) 🚩\n" +
                              "हिन्दुस्तानी बस्ती, अमृतसर (पंजाब) - 143001\n" +
                              "----------------------------------------\n" +
                              "🪪 डिजिटल सदस्यता पहचान पत्र (ID CARD) 🪪\n" +
                              "----------------------------------------\n" +
                              "सदस्य ID   : BSS-MEM-" + idHash + "\n" +
                              "नाम        : " + name.toUpperCase() + "\n" +
                              "मोबाइल     : " + (phone.isEmpty() ? "N/A" : phone) + "\n" +
                              "पद         : सक्रिय धर्म सेवादार\n" +
                              "कुल सेवा   : ₹" + memberTotal + "\n" +
                              "जारीकर्ता   : अतुल (व्यवस्थापक) - 97804-75164\n" +
                              "----------------------------------------\n" +
                              "॥ जय माता दी ॥";

                      Toast.makeText(this, "रंग-बिरंगी रसीद तैयार हो गई!", Toast.LENGTH_SHORT).show();
                  }

                  prefs.edit()
                          .putString("records", newGeneralEntry + existingGeneral)
                          .putInt("sewa_total", sewaTotal)
                          .putInt("expense_total", expenseTotal)
                          .putInt("entry_count", entryCount)
                          .apply();

                  loadRecords("");
                  if (!isExpense) showMemberChart();
                  etAmount.setText("");
              }

