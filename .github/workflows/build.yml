name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -q "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -r baal-sewak-sabha-native-android/* .
          fi

      - name: Inject Original Image Logo
        run: |
          # प्रोजेक्ट के रिसोर्स फ़ोल्डर्स को पक्का करना
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          # अगर माँ दुर्गा का असली लोगो है, तो उसे app_logo में बदलना
          # इसमें आपकी अपलोड की हुई 'image_6.png' या 'logo.png' खुद-ब-खुद आ जाएगी
          TARGET_LOGO=$(find . -maxdepth 2 -iname "*logo*" -o -iname "*1003244085*" | head -n 1)
          if [ -n "$TARGET_LOGO" ]; then
            echo "Applying Logo: $TARGET_LOGO"
            cp "$TARGET_LOGO" app/src/main/res/drawable/app_logo.png
            cp "$TARGET_LOGO" app/src/main/res/drawable/app_logo.jpg
            
            # सभी होम स्क्रीन आइकन साइज़ पर सेट करना
            for folder in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do
              cp "$TARGET_LOGO" app/src/main/res/$folder/ic_launcher.png
              cp "$TARGET_LOGO" app/src/main/res/$folder/ic_launcher_round.png
            done
          else
            # अगर कोई लोगो नहीं मिलता है, तो पुराने डिफॉल्ट लोगो को सहारा देना ताकि लाल एरर बिल्कुल न आए
            echo "WARNING: Logo missing. Creating dummy logo fallback to avoid build failure."
            touch app/src/main/res/drawable/app_logo.png
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Original-Fixed
          path: "**/build/outputs/apk/debug/*.apk"
