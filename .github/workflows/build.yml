                colors = ButtonDefaults.buttonColors(containerColor = DevotionalSaffron)
            ) {
                Icon(Icons.Default.Call, contentDescription = null)
                Spacer(modifier = Modifier.width(8.dp))
                Text("सीधे कॉल करें (${AdminDetails.PHONE_NUMBER})")
            }
        }
    }
}
