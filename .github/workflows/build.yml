name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip -qo "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -rf baal-sewak-sabha-native-android/* .
          fi

      - name: Overwrite Default Icons With Original Logo
        run: |
          # 1. अपलोडेड असली लोगो को खोजना
          LOGO=$(find . -maxdepth 2 -iname "*logo*" -o -iname "*1003244085*" | head -n 1)
          echo "Found logo at: $LOGO"

          if [ -n "$LOGO" ]; then
            mkdir -p app/src/main/res/drawable
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.png

            # 2. पुराने एडेप्टिव XML आइकन हटाना ताकि असली फोटो दिखे
            rm -rf app/src/main/res/mipmap-anydpi*

            # 3. सभी रेजोल्यूशन फोल्डर्स में लोगो डालना
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/src/main/res/$d
              cp -f "$LOGO" app/src/main/res/$d/ic_launcher.png
              cp -f "$LOGO" app/src/main/res/$d/ic_launcher_round.png
            done
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Executable
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Logo-APK
          path: "app/build/outputs/apk/debug/*.apk"
