name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip -qo "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -rf baal-sewak-sabha-native-android/* .
          fi

      - name: Force Apply Original Mata Durga Logo
        run: |
          # असली गोल लोगो फ़ाइल को ढूँढें
          LOGO=$(find . -maxdepth 2 \( -iname "*1003244085*" -o -iname "*logo*" -o -iname "*.jpg" -o -iname "*.png" \) ! -path "./.git/*" -type f | head -n 1)
          echo "Original Logo found: $LOGO"
          
          if [ -n "$LOGO" ]; then
            # कार्टून और डिफ़ॉल्ट एंड्रॉयड रोबोट/वेक्टर आइकन पूरी तरह मिटाएँ
            rm -rf app/src/main/res/mipmap-anydpi*
            rm -rf app/src/main/res/drawable-anydpi*
            rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
            rm -f app/src/main/res/mipmap-*/ic_launcher*.webp
            
            # ऐप के अंदर दिखने वाला बैनर/लोगो सेट करें
            mkdir -p app/src/main/res/drawable
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.png || true
            cp -f "$LOGO" app/src/main/res/drawable/logo.png || true

            # हर स्क्रीन साइज़ पर असली गोल लोगो सेट करें
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
              mkdir -p "app/src/main/res/$d"
              cp -f "$LOGO" "app/src/main/res/$d/ic_launcher.png" || true
              cp -f "$LOGO" "app/src/main/res/$d/ic_launcher_round.png" || true
            done
          fi

      - name: Set Permissions
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Original-Logo-APK
          path: "app/build/outputs/apk/debug/*.apk"
