name: Build Baal Sewak Sabha App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Fresh Standalone Project
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BaalSewakSabha"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/baalsewaksabha/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-hi
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.baalsewaksabha.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.baalsewaksabha.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Baal Sewak Sabha</string>
              <string name="org_title">Baal Sewak Sabha (Regd.)</string>
              <string name="org_sub">Hindustani Basti, Amritsar (Punjab)</string>
              <string name="admin_info">Admin: Atul (S/o Raj Kumar) | Helpline: 97804-75164</string>
              <string name="member_name">Member Name</string>
              <string name="amount">Sewa Amount (₹)</string>
              <string name="btn_add_sewa">Save Sewa Record</string>
              <string name="btn_share_receipt">Share Digital Receipt</string>
              <string name="records_title">Monthly Sewa Register</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-hi/strings.xml
          <resources>
              <string name="app_name">बाल सेवक सभा</string>
              <string name="org_title">बाल सेवक सभा (रजि.)</string>
              <string name="org_sub">हिन्दुस्तानी बस्ती, अमृतसर (पंजाब)</string>
              <string name="admin_info">व्यवस्थापक: अतुल (सुपुत्र: श्री राज कुमार) | संपर्क: 97804-75164</string>
              <string name="member_name">सदस्य का नाम</string>
              <string name="amount">सेवा राशि (₹)</string>
              <string name="btn_add_sewa">सेवा दर्ज करें</string>
              <string name="btn_share_receipt">डिजिटल रसीद शेयर करें</string>
              <string name="records_title">मासिक सेवा रजिस्टर</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFF9F9">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:gravity="center_horizontal">

                  <ImageView
                      android:id="@+id/imgLogo"
                      android:layout_width="110dp"
                      android:layout_height="110dp"
                      android:src="@drawable/ic_launcher"
                      android:scaleType="fitCenter" />

                  <TextView
                      android:id="@+id/txtOrgTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/org_title"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:textColor="#B71C1C"
                      android:layout_marginTop="8dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/org_sub"
                      android:textSize="13sp"
                      android:textColor="#555" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/admin_info"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:textColor="#1B5E20"
                      android:layout_marginTop="4dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginTop="12dp">
                      <Button
                          android:id="@+id/btnLangHi"
                          android:layout_width="wrap_content"
                          android:layout_height="38dp"
                          android:text="हिंदी"
                          android:textSize="12sp"
                          android:layout_marginEnd="8dp" />
                      <Button
                          android:id="@+id/btnLangEn"
                          android:layout_width="wrap_content"
                          android:layout_height="38dp"
                          android:text="English"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <EditText
                      android:id="@+id/etMemberName"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/member_name"
                      android:layout_marginTop="14dp" />

                  <Spinner
                      android:id="@+id/spMonth"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginTop="8dp" />

                  <EditText
                      android:id="@+id/etAmount"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/amount"
                      android:inputType="number"
                      android:layout_marginTop="8dp" />

                  <Button
                      android:id="@+id/btnSaveSewa"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_add_sewa"
                      android:backgroundTint="#B71C1C"
                      android:textColor="#FFFFFF"
                      android:layout_marginTop="10dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/records_title"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      android:textColor="#333"
                      android:layout_marginTop="20dp" />

                  <TextView
                      android:id="@+id/txtRecords"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Abhi koi record nahi hai."
                      android:padding="10dp"
                      android:background="#EEEEEE"
                      android:layout_marginTop="8dp" />

                  <Button
                      android:id="@+id/btnShareReceipt"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_share_receipt"
                      android:backgroundTint="#1B5E20"
                      android:textColor="#FFFFFF"
                      android:layout_marginTop="10dp" />
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/baalsewaksabha/app/MainActivity.java
          package com.baalsewaksabha.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.content.res.Resources;
          import android.os.Bundle;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private EditText etMemberName, etAmount;
              private Spinner spMonth;
              private TextView txtRecords;
              private SharedPreferences prefs;
              private String lastReceipt = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etMemberName = findViewById(R.id.etMemberName);
                  etAmount = findViewById(R.id.etAmount);
                  spMonth = findViewById(R.id.spMonth);
                  txtRecords = findViewById(R.id.txtRecords);
                  Button btnSaveSewa = findViewById(R.id.btnSaveSewa);
                  Button btnShareReceipt = findViewById(R.id.btnShareReceipt);
                  Button btnLangHi = findViewById(R.id.btnLangHi);
                  Button btnLangEn = findViewById(R.id.btnLangEn);

                  prefs = getSharedPreferences("SewaPrefs", Context.MODE_PRIVATE);

                  String[] months = {
                      "January / जनवरी", "February / फ़रवरी", "March / मार्च",
                      "April / अप्रैल", "May / मई", "June / जून",
                      "July / जुलाई", "August / अगस्त", "September / सितम्बर",
                      "October / अक्टूबर", "November / नवम्बर", "December / दिसम्बर"
                  };
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, months);
                  spMonth.setAdapter(adapter);

                  loadRecords();

                  btnSaveSewa.setOnClickListener(v -> saveRecord());
                  btnShareReceipt.setOnClickListener(v -> shareReceipt());

                  btnLangHi.setOnClickListener(v -> setAppLocale("hi"));
                  btnLangEn.setOnClickListener(v -> setAppLocale("en"));
              }

              private void setAppLocale(String langCode) {
                  Locale locale = new Locale(langCode);
                  Locale.setDefault(locale);
                  Resources res = getResources();
                  Configuration config = res.getConfiguration();
                  config.setLocale(locale);
                  res.updateConfiguration(config, res.getDisplayMetrics());
                  recreate();
              }

              private void saveRecord() {
                  String name = etMemberName.getText().toString().trim();
                  String amt = etAmount.getText().toString().trim();
                  String month = spMonth.getSelectedItem().toString();

                  if (name.isEmpty() || amt.isEmpty()) {
                      Toast.makeText(this, "Kripya Naam aur Rashi bharein", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String dateStr = new SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(new Date());
                  String newEntry = "• " + name + " | " + month + " | ₹" + amt + " (" + dateStr + ")\n";

                  String existing = prefs.getString("records", "");
                  String updated = newEntry + existing;
                  prefs.edit().putString("records", updated).apply();

                  lastReceipt = "🚩 BAAL SEWAK SABHA (REGD.) 🚩\n" +
                          "Hindustani Basti, Amritsar (Punjab)\n" +
                          "-----------------------------------\n" +
                          "★ DIGITAL SEWA RECEIPT ★\n" +
                          "Sadasya: " + name + "\n" +
                          "Mahina: " + month + "\n" +
                          "Sewa Rashi: ₹" + amt + "\n" +
                          "Tithi: " + dateStr + "\n" +
                          "-----------------------------------\n" +
                          "Vyavasthapak: Atul (S/o Raj Kumar)\n" +
                          "Helpline: 97804-75164\n" +
                          "॥ JAI MATA DI ॥";

                  etMemberName.setText("");
                  etAmount.setText("");
                  loadRecords();
                  Toast.makeText(this, "Sewa Safaltapoorvak Darj Ho Gayi!", Toast.LENGTH_SHORT).show();
              }

              private void loadRecords() {
                  String records = prefs.getString("records", "Abhi koi record darj nahi hai.");
                  txtRecords.setText(records);
              }

              private void shareReceipt() {
                  if (lastReceipt.isEmpty()) {
                      Toast.makeText(this, "Pehle koi sewa darj karein!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_SEND);
                  intent.setType("text/plain");
                  intent.putExtra(Intent.EXTRA_SUBJECT, "Baal Sewak Sabha Sewa Receipt");
                  intent.putExtra(Intent.EXTRA_TEXT, lastReceipt);
                  startActivity(Intent.createChooser(intent, "Receipt Share Karein"));
              }
          }
          EOF

      - name: Force Apply Original Logo
        run: |
          LOGO=$(find . -maxdepth 2 \( -iname "*1003244085*" -o -iname "*logo*" -o -iname "*.jpg" -o -iname "*.png" \) ! -path "./.git/*" -type f | head -n 1)
          if [ -n "$LOGO" ]; then
            cp -f "$LOGO" app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Registered-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
