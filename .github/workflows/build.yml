name: Build Ultra Advance Baal Sewak Sabha App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete Ultra Advance Project
        run: |
          mkdir -p app/src/main/java/com/baalsewaksabha/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-hi
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.baalsewaksabha.app"
              android:versionCode="14"
              android:versionName="14.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Baal Sewak Sabha</string>
              <string name="org_title">🚩 Baal Sewak Sabha (Regd.) 🚩</string>
              <string name="org_sub">Hindustani Basti, Amritsar (Punjab) - 143001</string>
              <string name="admin_info">Vyavasthapak: Atul (S/o Raj Kumar) | Helpline: 97804-75164</string>
              <string name="search_hint">Search Member by Name or Mobile...</string>
              <string name="member_name">Member Full Name</string>
              <string name="member_phone">Mobile Number</string>
              <string name="amount">Sewa Amount (₹)</string>
              <string name="select_date">Change Date (DD-MM-YYYY)</string>
              <string name="btn_add_sewa">Save &amp; Generate Sewa Receipt</string>
              <string name="btn_share_receipt">Share Official Receipt (WhatsApp)</string>
              <string name="btn_whatsapp_reminder">Send Monthly Sewa Reminder</string>
              <string name="btn_show_chart">Show Member Full Chart</string>
              <string name="chart_title">Member Date-wise Sewa Record</string>
              <string name="records_title">All Members Sewa Register</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-hi/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">बाल सेवक सभा</string>
              <string name="org_title">🚩 बाल सेवक सभा (रजि.) 🚩</string>
              <string name="org_sub">हिन्दुस्तानी बस्ती, अमृतसर (पंजाब) - 143001</string>
              <string name="admin_info">व्यवस्थापक: अतुल (सुपुत्र: श्री राज कुमार) | संपर्क: 97804-75164</string>
              <string name="search_hint">सदस्य का नाम या मोबाइल नंबर खोजें...</string>
              <string name="member_name">सदस्य का पूरा नाम</string>
              <string name="member_phone">मोबाइल नंबर</string>
              <string name="amount">सेवा राशि (₹)</string>
              <string name="select_date">तारीख बदलें (DD-MM-YYYY)</string>
              <string name="btn_add_sewa">सेवा दर्ज करें व रसीद बनाएं</string>
              <string name="btn_share_receipt">आधिकारिक रसीद शेयर करें (WhatsApp)</string>
              <string name="btn_whatsapp_reminder">व्हाट्सएप सेवा स्मरण (Reminder) भेजें</string>
              <string name="btn_show_chart">सदस्य का फुल सेवा चार्ट देखें</string>
              <string name="chart_title">सदस्य का तारीखवार सेवा रिकॉर्ड</string>
              <string name="records_title">सभी सदस्यों का मासिक सेवा रजिस्टर</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FCF8F5">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:gravity="center_horizontal">

                  <ImageView
                      android:id="@+id/imgLogo"
                      android:layout_width="110dp"
                      android:layout_height="110dp"
                      android:src="@drawable/ic_launcher"
                      android:scaleType="fitCenter" />

                  <TextView
                      android:id="@+id/txtOrgTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/org_title"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:textColor="#B71C1C"
                      android:gravity="center"
                      android:layout_marginTop="8dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/org_sub"
                      android:textSize="13sp"
                      android:textColor="#424242"
                      android:gravity="center" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/admin_info"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:textColor="#1B5E20"
                      android:gravity="center"
                      android:layout_marginTop="4dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginTop="10dp">
                      <Button
                          android:id="@+id/btnLangHi"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:text="हिंदी"
                          android:textSize="12sp"
                          android:layout_marginEnd="10dp" />
                      <Button
                          android:id="@+id/btnLangEn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:text="English"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <!-- Live Search Bar -->
                  <EditText
                      android:id="@+id/etSearch"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/search_hint"
                      android:background="#FFFFFF"
                      android:padding="10dp"
                      android:layout_marginTop="12dp" />

                  <EditText
                      android:id="@+id/etMemberName"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/member_name"
                      android:layout_marginTop="10dp" />

                  <EditText
                      android:id="@+id/etMemberPhone"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/member_phone"
                      android:inputType="phone"
                      android:layout_marginTop="6dp" />

                  <Spinner
                      android:id="@+id/spMonth"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnPickDate"
                      android:layout_width="match_parent"
                      android:layout_height="42dp"
                      android:text="@string/select_date"
                      android:layout_marginTop="6dp" />

                  <EditText
                      android:id="@+id/etAmount"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/amount"
                      android:inputType="number"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnSaveSewa"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_add_sewa"
                      android:layout_marginTop="10dp" />

                  <Button
                      android:id="@+id/btnShareReceipt"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_share_receipt"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnWhatsappReminder"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_whatsapp_reminder"
                      android:layout_marginTop="6dp" />

                  <Button
                      android:id="@+id/btnShowChart"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/btn_show_chart"
                      android:layout_marginTop="6dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/chart_title"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      android:textColor="#1B5E20"
                      android:layout_marginTop="18dp" />

                  <TextView
                      android:id="@+id/txtMemberChart"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Member ka naam likh kar 'Show Member Full Chart' par tap karein."
                      android:padding="12dp"
                      android:background="#E8F5E9"
                      android:textColor="#1B5E20"
                      android:textStyle="bold"
                      android:layout_marginTop="6dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/records_title"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      android:textColor="#B71C1C"
                      android:layout_marginTop="20dp" />

                  <TextView
                      android:id="@+id/txtTotal"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Total Sewa Collection: ₹0"
                      android:textStyle="bold"
                      android:textColor="#1B5E20"
                      android:layout_marginTop="4dp" />

                  <TextView
                      android:id="@+id/txtRecords"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Koi record uplabdh nahi hai."
                      android:padding="12dp"
                      android:background="#EFEBE9"
                      android:layout_marginTop="8dp" />
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/baalsewaksabha/app/MainActivity.java
          package com.baalsewaksabha.app;

          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.content.res.Resources;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.DatePicker;
          import android.widget.EditText;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private EditText etMemberName, etMemberPhone, etAmount, etSearch;
              private Spinner spMonth;
              private TextView txtRecords, txtTotal, txtMemberChart;
              private Button btnPickDate;
              private SharedPreferences prefs;
              private String lastReceiptText = "";
              private String selectedDateStr = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etSearch = (EditText) findViewById(R.id.etSearch);
                  etMemberName = (EditText) findViewById(R.id.etMemberName);
                  etMemberPhone = (EditText) findViewById(R.id.etMemberPhone);
                  etAmount = (EditText) findViewById(R.id.etAmount);
                  spMonth = (Spinner) findViewById(R.id.spMonth);
                  txtRecords = (TextView) findViewById(R.id.txtRecords);
                  txtTotal = (TextView) findViewById(R.id.txtTotal);
                  txtMemberChart = (TextView) findViewById(R.id.txtMemberChart);
                  btnPickDate = (Button) findViewById(R.id.btnPickDate);

                  Button btnSaveSewa = (Button) findViewById(R.id.btnSaveSewa);
                  Button btnShareReceipt = (Button) findViewById(R.id.btnShareReceipt);
                  Button btnWhatsappReminder = (Button) findViewById(R.id.btnWhatsappReminder);
                  Button btnShowChart = (Button) findViewById(R.id.btnShowChart);
                  Button btnLangHi = (Button) findViewById(R.id.btnLangHi);
                  Button btnLangEn = (Button) findViewById(R.id.btnLangEn);

                  prefs = getSharedPreferences("SewaUltraDB", Context.MODE_PRIVATE);

                  selectedDateStr = new SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(new Date());
                  btnPickDate.setText("Date: " + selectedDateStr);

                  String[] months = {
                      "January / जनवरी", "February / फ़रवरी", "March / मार्च",
                      "April / अप्रैल", "May / मई", "June / जून",
                      "July / जुलाई", "August / अगस्त", "September / सितम्बर",
                      "October / अक्टूबर", "November / नवम्बर", "December / दिसम्बर"
                  };
                  ArrayAdapter<String> adapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, months);
                  spMonth.setAdapter(adapter);

                  loadRecords("");

                  btnPickDate.setOnClickListener(v -> showDatePicker());
                  btnSaveSewa.setOnClickListener(v -> saveRecord());
                  btnShareReceipt.setOnClickListener(v -> shareReceipt());
                  btnWhatsappReminder.setOnClickListener(v -> sendReminder());
                  btnShowChart.setOnClickListener(v -> showMemberChart());

                  btnLangHi.setOnClickListener(v -> setAppLocale("hi"));
                  btnLangEn.setOnClickListener(v -> setAppLocale("en"));

                  etSearch.addTextWatcher(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          loadRecords(s.toString().trim());
                      }
                      @Override
                      public void afterTextChanged(Editable s) {}
                  });
              }

              private void showDatePicker() {
                  Calendar c = Calendar.getInstance();
                  int y = c.get(Calendar.YEAR);
                  int m = c.get(Calendar.MONTH);
                  int d = c.get(Calendar.DAY_OF_MONTH);

                  DatePickerDialog dp = new DatePickerDialog(this, (view, year, month, dayOfMonth) -> {
                      selectedDateStr = String.format(Locale.getDefault(), "%02d-%02d-%04d", dayOfMonth, month + 1, year);
                      btnPickDate.setText("Date: " + selectedDateStr);
                  }, y, m, d);
                  dp.show();
              }

              private void setAppLocale(String langCode) {
                  Locale locale = new Locale(langCode);
                  Locale.setDefault(locale);
                  Resources res = getResources();
                  Configuration config = res.getConfiguration();
                  config.locale = locale;
                  res.updateConfiguration(config, res.getDisplayMetrics());
                  recreate();
              }

              private void saveRecord() {
                  String name = etMemberName.getText().toString().trim();
                  String phone = etMemberPhone.getText().toString().trim();
                  String amtStr = etAmount.getText().toString().trim();
                  String month = spMonth.getSelectedItem().toString();

                  if (name.isEmpty() || amtStr.isEmpty()) {
                      Toast.makeText(this, "Member ka naam aur sewa amount bharein!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  int amount = 0;
                  try {
                      amount = Integer.parseInt(amtStr);
                  } catch (Exception ignored) {}

                  String newGeneralEntry = "• " + name + " (" + (phone.isEmpty() ? "N/A" : phone) + ")\n  " + month + " | ₹" + amount + " | " + selectedDateStr + "\n\n";

                  String memberKey = "CHART_" + name.toLowerCase().replaceAll("\\s+", "");
                  String memberHistory = prefs.getString(memberKey, "");
                  int memberTotal = prefs.getInt("TOTAL_" + memberKey, 0) + amount;
                  String newChartRow = "📅 " + selectedDateStr + " | " + month + " | ₹" + amount + "\n";

                  String existingGeneral = prefs.getString("records", "");
                  int currentOverallTotal = prefs.getInt("total", 0) + amount;

                  prefs.edit()
                          .putString("records", newGeneralEntry + existingGeneral)
                          .putInt("total", currentOverallTotal)
                          .putString(memberKey, newChartRow + memberHistory)
                          .putInt("TOTAL_" + memberKey, memberTotal)
                          .apply();

                  lastReceiptText = "🚩 BAAL SEWAK SABHA (REGD.) 🚩\n" +
                          "Hindustani Basti, Amritsar (Punjab) - 143001\n" +
                          "----------------------------------------\n" +
                          "📜 OFFICIAL DIGITAL SEWA RECEIPT 📜\n" +
                          "----------------------------------------\n" +
                          "Member Name : " + name + "\n" +
                          "Mobile      : " + (phone.isEmpty() ? "N/A" : phone) + "\n" +
                          "Sewa Month  : " + month + "\n" +
                          "Sewa Amount : ₹" + amount + " /- (Received)\n" +
                          "Sewa Date   : " + selectedDateStr + "\n" +
                          "----------------------------------------\n" +
                          "Vyavasthapak: Atul (S/o Raj Kumar)\n" +
                          "Helpline    : +91 97804-75164\n" +
                          "॥ JAI MATA DI ॥";

                  loadRecords("");
                  showMemberChart();
                  etAmount.setText("");
                  Toast.makeText(this, "Sewa register ho gayi!", Toast.LENGTH_SHORT).show();
              }

              private void showMemberChart() {
                  String name = etMemberName.getText().toString().trim();
                  if (name.isEmpty()) {
                      Toast.makeText(this, "Chart dekhne ke liye naam likhein!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String memberKey = "CHART_" + name.toLowerCase().replaceAll("\\s+", "");
                  String history = prefs.getString(memberKey, "");
                  int total = prefs.getInt("TOTAL_" + memberKey, 0);

                  if (history.isEmpty()) {
                      txtMemberChart.setText("Member: " + name + "\nKoi chart record nahi mila.");
                  } else {
                      txtMemberChart.setText("🚩 Member Sewa Chart: " + name.toUpperCase() + "\nTotal Sewa: ₹" + total + "\n-----------------------------------\n" + history);
                  }
              }

              private void loadRecords(String query) {
                  String rawRecords = prefs.getString("records", "Koi record uplabdh nahi hai.");
                  int total = prefs.getInt("total", 0);
                  txtTotal.setText("Total Sewa Collection: ₹" + total);

                  if (query.isEmpty() || rawRecords.equals("Koi record uplabdh nahi hai.")) {
                      txtRecords.setText(rawRecords);
                      return;
                  }

                  StringBuilder filtered = new StringBuilder();
                  String[] items = rawRecords.split("\n\n");
                  for (String item : items) {
                      if (item.toLowerCase().contains(query.toLowerCase())) {
                          filtered.append(item).append("\n\n");
                      }
                  }

                  if (filtered.length() == 0) {
                      txtRecords.setText("'" + query + "' ke liye koi record nahi mila.");
                  } else {
                      txtRecords.setText(filtered.toString());
                  }
              }

              private void shareReceipt() {
                  if (lastReceiptText.isEmpty()) {
                      Toast.makeText(this, "Pehle kisi member ki sewa save karein!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_SEND);
                  intent.setType("text/plain");
                  intent.putExtra(Intent.EXTRA_SUBJECT, "Baal Sewak Sabha Digital Receipt");
                  intent.putExtra(Intent.EXTRA_TEXT, lastReceiptText);
                  startActivity(Intent.createChooser(intent, "Share Receipt (WhatsApp)"));
              }

              private void sendReminder() {
                  String name = etMemberName.getText().toString().trim();
                  String month = spMonth.getSelectedItem().toString();

                  String reminderText = "🚩 JAI MATA DI 🚩\n" +
                          "Baal Sewak Sabha (Regd.), Amritsar\n\n" +
                          "Respected Member " + (name.isEmpty() ? "" : name) + ",\n" +
                          "Yeh " + month + " ki sabha sewa ka hardik smaran (reminder) hai.\n" +
                          "Kripya apni monthly sewa darj karwake sabha ke dharamik karyon me sahyog karein.\n\n" +
                          "Vyavasthapak: Atul (S/o Raj Kumar)\n" +
                          "Helpline: 97804-75164";

                  Intent intent = new Intent(Intent.ACTION_SEND);
                  intent.setType("text/plain");
                  intent.putExtra(Intent.EXTRA_TEXT, reminderText);
                  startActivity(Intent.createChooser(intent, "Send Monthly Reminder"));
              }
          }
          EOF

      - name: Attach Org Logo
        run: |
          LOGO=$(find . -maxdepth 2 \( -iname "*1003244085*" -o -iname "*logo*" -o -iname "*.jpg" -o -iname "*.png" \) ! -path "./.git/*" -type f | head -n 1)
          if [ -n "$LOGO" ]; then
            cp -f "$LOGO" app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Build APK Direct Engine
        run: |
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          mkdir -p build_output/gen build_output/obj

          $BUILD_TOOLS/aapt package -f -m -J build_output/gen -M app/src/main/AndroidManifest.xml -S app/src/main/res -I "$ANDROID_JAR"
          javac -source 1.8 -target 1.8 -d build_output/obj -cp "$ANDROID_JAR" $(find app/src/main/java build_output/gen -name "*.java")
          $BUILD_TOOLS/d8 --output build_output/ $(find build_output/obj -name "*.class")

          $BUILD_TOOLS/aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I "$ANDROID_JAR" -F build_output/unaligned.apk
          cd build_output
          $BUILD_TOOLS/aapt add unaligned.apk classes.dex
          cd ..

          keytool -genkeypair -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=BaalSewakSabha, OU=App, O=Org, L=Amritsar, S=Punjab, C=IN"
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:123456 --out Baal-Sewak-Sabha-Ultra.apk build_output/unaligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Ultra-Final-APK
          path: "Baal-Sewak-Sabha-Ultra.apk"
