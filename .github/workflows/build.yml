              private void showMemberChart() {
                  String name = etMemberName.getText().toString().trim();
                  if (name.isEmpty()) {
                      Toast.makeText(this, "चार्ट देखने के लिए सदस्य का नाम लिखें!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String memberKey = "CHART_" + name.toLowerCase().replaceAll("\\s+", "");
                  String history = prefs.getString(memberKey, "");
                  int total = prefs.getInt("TOTAL_" + memberKey, 0);

                  if (history.isEmpty()) {
                      txtMemberChart.setText("सदस्य: " + name + "\nकोई सेवा चार्ट रिकॉर्ड नहीं मिला।");
                  } else {
                      txtMemberChart.setText("🚩 सदस्य सेवा चार्ट: " + name.toUpperCase() + "\nकुल सेवा: ₹" + total + "\n-----------------------------------\n" + history);
                  }
              }

              private void loadRecords(String query) {
                  String rawRecords = prefs.getString("records", "अभी कोई रिकॉर्ड मौजूद नहीं है।");
                  int sewa = prefs.getInt("sewa_total", 0);
                  int expense = prefs.getInt("expense_total", 0);
                  int balance = sewa - expense;
                  int count = prefs.getInt("entry_count", 0);

                  txtAnalytics.setText("📊 कुल सेवा: ₹" + sewa + " | कुल खर्च: ₹" + expense + "\n💰 शेष बैलेंस: ₹" + balance + " | कुल एंट्रीज: " + count);

                  if (query.isEmpty() || rawRecords.equals("अभी कोई रिकॉर्ड मौजूद नहीं है।")) {
                      txtRecords.setText(rawRecords);
                      return;
                  }

                  StringBuilder filtered = new StringBuilder();
                  String[] items = rawRecords.split("\n\n");
                  for (String item : items) {
                      if (item.toLowerCase().contains(query.toLowerCase())) {
                          filtered.append(item).append("\n\n");
                      }
                  }

                  if (filtered.length() == 0) {
                      txtRecords.setText("'" + query + "' के लिए कोई रिकॉर्ड नहीं मिला।");
                  } else {
                      txtRecords.setText(filtered.toString());
                  }
              }

