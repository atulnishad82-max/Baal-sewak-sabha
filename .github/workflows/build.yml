name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -qo "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -rf baal-sewak-sabha-native-android/* .
          fi

      - name: Setup Original Logo Safely
        run: |
          # असली लोगो फ़ाइल खोजना
          LOGO=$(find . -maxdepth 2 \( -iname "*logo*" -o -iname "*1003244085*" \) -type f | head -n 1)
          echo "Found logo: $LOGO"

          if [ -n "$LOGO" ]; then
            mkdir -p app/src/main/res/drawable
            # दोनों फॉर्मेट सपोर्ट के लिए
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.png || true
            
            # ऐप आइकॉन सेट करना
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/src/main/res/$d
              cp -f "$LOGO" app/src/main/res/$d/ic_launcher.png || true
              cp -f "$LOGO" app/src/main/res/$d/ic_launcher_round.png || true
            done
          fi

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Execution Permissions
        run: chmod +x gradlew || true

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Publish Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-APK
          path: "app/build/outputs/apk/debug/*.apk"
