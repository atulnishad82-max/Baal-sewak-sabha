                      generateColourfulReceiptBitmap(recNo, name, (phone.isEmpty() ? "N/A" : phone), month, mode, String.valueOf(amount), selectedDateStr);

                      int idHash = name.hashCode() > 0 ? name.hashCode() % 10000 : (-name.hashCode()) % 10000;
