                    Text("नाम: ${AdminDetails.ADMIN_NAME}", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                    Text("पिता का नाम: Sh. ${AdminDetails.FATHER_NAME}", fontSize = 15.sp)
                    Text("फ़ोन नंबर: ${AdminDetails.PHONE_NUMBER}", fontSize = 15.sp, fontWeight = FontWeight.Medium)
                    Text("स्थान: हिन्दुस्तानी बस्ती, अमृतसर", fontSize = 14.sp, color = Color.Gray)
                }
