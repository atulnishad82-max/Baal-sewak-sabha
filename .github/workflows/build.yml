name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip -qo "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -rf baal-sewak-sabha-native-android/* .
          fi

      - name: Set Original Durga Mata Logo
        run: |
          LOGO=$(find . -maxdepth 2 \( -iname "*1003244085*" -o -iname "*logo*" -o -iname "*.jpg" -o -iname "*.png" \) ! -path "./.git/*" -type f | head -n 1)
          if [ -n "$LOGO" ]; then
            rm -rf app/src/main/res/mipmap-anydpi*
            rm -rf app/src/main/res/drawable-anydpi*
            rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
            rm -f app/src/main/res/mipmap-*/ic_launcher*.webp
            mkdir -p app/src/main/res/drawable
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.png || true
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
              mkdir -p "app/src/main/res/$d"
              cp -f "$LOGO" "app/src/main/res/$d/ic_launcher.png" || true
              cp -f "$LOGO" "app/src/main/res/$d/ic_launcher_round.png" || true
            done
          fi

      - name: Inject Monthly Sewa Register
        run: |
          PACKAGE_DIR=$(find app/src/main/java -type d | tail -n 1)
          cat << 'EOF' > "$PACKAGE_DIR/SewaItem.java"
          package com.example.baalsewaksabha;
          public class SewaItem {
              public String month;
              public String name;
              public String amount;
              public String date;
              public SewaItem(String month, String name, String amount, String date) {
                  this.month = month;
                  this.name = name;
                  this.amount = amount;
                  this.date = date;
              }
          }
          EOF

      - name: Set Permissions
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Monthly-Sewa-APK
          path: "app/build/outputs/apk/debug/*.apk"
