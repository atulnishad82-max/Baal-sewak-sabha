name: Build Ultra Advance Baal Sewak Sabha App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Standalone APK Direct
        run: |
          set -e

          mkdir -p project/src/com/baalsewaksabha/app
          mkdir -p project/res/layout
          mkdir -p project/res/values
          mkdir -p project/res/values-hi
          mkdir -p project/res/drawable
          mkdir -p project/res/xml
          mkdir -p project/bin

          # 1. FileProvider XML Config
          cat << 'EOF' > project/res/xml/provider_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="int_cache" path="." />
          </paths>
          EOF

          # 2. Strings English
          cat << 'EOF' > project/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Baal Sewak Sabha</string>
              <string name="org_title">🚩 Baal Sewak Sabha (Regd.) 🚩</string>
              <string name="org_sub">Hindustani Basti, Amritsar (Punjab) - 143001</string>
              <string name="admin_info">Vyavasthapak: Atul (S/o Raj Kumar) | Helpline: 97804-75164</string>
              <string name="search_hint">Search Member by Name or Mobile...</string>
              <string name="member_name">Member Full Name / Expense Reason</string>
              <string name="member_phone">Mobile Number (WhatsApp)</string>
              <string name="amount">Amount (₹)</string>
              <string name="select_date">Change Date (DD-MM-YYYY)</string>
              <string name="btn_add_sewa">Save Sewa Entry</string>
              <string name="btn_add_expense">Save Sabha Expense</string>
              <string name="btn_share_receipt">📸 Share Stamped QR Receipt (WhatsApp)</string>
              <string name="btn_share_id">🪪 Share Stamped Member ID Card</string>
              <string name="btn_whatsapp_direct">💬 Direct WhatsApp To Member</string>
              <string name="btn_whatsapp_reminder">Send WhatsApp Monthly Reminder</string>
              <string name="btn_show_chart">Show Member Full Chart</string>
              <string name="btn_share_all_report">Export Full Audit Report</string>
              <string name="btn_backup">Backup / Copy Data</string>
              <string name="btn_call_helpline">Call Admin Helpline</string>
              <string name="chart_title">Member Date-wise Sewa Record</string>
              <string name="records_title">Complete Register &amp; Accounts</string>
          </resources>
          EOF

