name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -qo "Zip file.zip"
          if [ -d "baal-sewak-sabha-native-android" ]; then
            cp -rf baal-sewak-sabha-native-android/* .
          fi

      - name: Set Original Logo Everywhere
        run: |
          # असली लोगो फ़ाइल को ढूँढना
          LOGO=$(find . -maxdepth 2 \( -iname "*logo*" -o -iname "*1003244085*" \) -type f | head -n 1)
          echo "Found logo: $LOGO"

          if [ -n "$LOGO" ]; then
            mkdir -p app/src/main/res/drawable
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.png
            cp -f "$LOGO" app/src/main/res/drawable/app_logo.jpg

            # पुराने डिफॉल्ट XML आइकन हटाना ताकि असली फोटो दिखे
            rm -rf app/src/main/res/mipmap-anydpi*

            # सभी साइज़ के ऐप आइकॉन में असली लोगो लगाना
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/src/main/res/$dir
              cp -f "$LOGO" app/src/main/res/$dir/ic_launcher.png
              cp -f "$LOGO" app/src/main/res/$dir/ic_launcher_round.png
            done
          fi

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Execution Permissions
        run: chmod +x gradlew || true

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baal-Sewak-Sabha-Original-APK
          path: "app/build/outputs/apk/debug/*.apk"
