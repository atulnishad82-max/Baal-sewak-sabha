}

@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun MonthlySewaScreen(onSaveReceipt: (MonthlyReceipt) -> Unit, onBack: () -> Unit) {
    var memberName by remember { mutableStateOf("") }
    var memberPhone by remember { mutableStateOf("") }
    var selectedMonth by remember { mutableStateOf("अक्टूबर 2026") }
    var amount by remember { mutableStateOf("100") }
    var showDialog by remember { mutableStateOf(false) }
    var lastReceipt by remember { mutableStateOf<MonthlyReceipt?>(null) }

    val months = listOf(
        "जनवरी", "फ़रवरी", "मार्च", "अप्रैल",
        "मई", "जून", "जुलाई", "अगस्त",
        "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"
    )

    Scaffold(
        topBar = {
            TopAppBar(
                title = { Text("मासिक सेवा (रसीद काटें)") },
                navigationIcon = {
                    IconButton(onClick = onBack) {
                        Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Back")
                    }
                }
            )
        }
    ) { padding ->
        Column(
            modifier = Modifier
                .padding(padding)
                .padding(16.dp)
                .verticalScroll(rememberScrollState()),
            verticalArrangement = Arrangement.spacedBy(12.dp)
        ) {
            Card(
                colors = CardDefaults.cardColors(containerColor = DevotionalSaffron.copy(alpha = 0.1f)),
                modifier = Modifier.fillMaxWidth()
            ) {
                Column(modifier = Modifier.padding(12.dp)) {
                    Text("स्थायी एडमिन: ${AdminDetails.ADMIN_NAME} S/o Sh. ${AdminDetails.FATHER_NAME}", fontWeight = FontWeight.Bold, color = DevotionalSaffron)
                    Text("फ़ोन नंबर: ${AdminDetails.PHONE_NUMBER}", fontSize = 13.sp)
                }
            }

            OutlinedTextField(
                value = memberName,
                onValueChange = { memberName = it },
                label = { Text("सदस्य का नाम") },
                modifier = Modifier.fillMaxWidth()
            )

            OutlinedTextField(
                value = memberPhone,
                onValueChange = { memberPhone = it },
                label = { Text("मोबाइल नंबर") },
                modifier = Modifier.fillMaxWidth()
            )

            Text("सेवा का महीना चुनें:", fontWeight = FontWeight.Bold)
            months.chunked(3).forEach { rowMonths ->
                Row(
                    modifier = Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.spacedBy(6.dp)
                ) {
                    rowMonths.forEach { m ->
                        FilterChip(
                            selected = (selectedMonth == m),
                            onClick = { selectedMonth = m },
                            label = { Text(m, fontSize = 11.sp) },
                            modifier = Modifier.weight(1f)
                        )
                    }
                }
            }

            OutlinedTextField(
                value = amount,
                onValueChange = { amount = it },
                label = { Text("सदस्यता सेवा राशि (₹)") },
                modifier = Modifier.fillMaxWidth()
            )

            Button(
                onClick = {
                    if (memberName.isNotBlank()) {
                        val receipt = MonthlyReceipt(
                            receiptNo = "BSS-${(1000..9999).random()}",
                            memberName = memberName,
                            memberPhone = memberPhone,
                            monthYear = selectedMonth,
                            amount = amount,
                            paymentDate = "08/10/2026"
                        )
                        lastReceipt = receipt
                        onSaveReceipt(receipt)
                        showDialog = true
                    }
                },
                modifier = Modifier.fillMaxWidth(),
                colors = ButtonDefaults.buttonColors(containerColor = DevotionalSaffron)
            ) {
                Text("सेवा जमा करें व रसीद बनाएं")
            }
        }
    }

    if (showDialog && lastReceipt != null) {
        val r = lastReceipt!!
        AlertDialog(
            onDismissRequest = { showDialog = false; onBack() },
            title = { Text("रसीद सुरक्षित हो गई!", fontWeight = FontWeight.Bold, color = DevotionalSaffron) },
            text = {
                Column(
                    modifier = Modifier
                        .fillMaxWidth()
                        .border(1.dp, Color.LightGray, RoundedCornerShape(8.dp))
                        .padding(12.dp)
                ) {
                    Text("रसीद सं.: ${r.receiptNo}", fontWeight = FontWeight.Bold)
                    Text("सदस्य: ${r.memberName} (${r.memberPhone})")
                    Text("माह: ${r.monthYear}")
                    Text("राशि: ₹${r.amount}", fontWeight = FontWeight.Bold, color = DevotionalSaffron)
                    Text("दिनांक: ${r.paymentDate}")
                    HorizontalDivider(modifier = Modifier.padding(vertical = 6.dp))
                    Text("अधिकृत एडमिन:", fontSize = 11.sp)
                    Text("${AdminDetails.ADMIN_NAME} S/o ${AdminDetails.FATHER_NAME}", fontWeight = FontWeight.Bold)
                    Text("फ़ोन: ${AdminDetails.PHONE_NUMBER}", fontSize = 11.sp)
                }
            },
            confirmButton = {
                TextButton(onClick = { showDialog = false; onBack() }) {
                    Text("ठीक है")
                }
            }
        )
    }
}

