              private void loadRecords(String query) {
                  String rawRecords = prefs.getString("records", "अभी कोई रिकॉर्ड मौजूद नहीं है।");
                  int sewa = prefs.getInt("sewa_total", 0);
                  int expense = prefs.getInt("expense_total", 0);
                  int balance = sewa - expense;
                  int count = prefs.getInt("entry_count", 0);

                  txtAnalytics.setText("📊 कुल सेवा: ₹" + sewa + " | कुल खर्च: ₹" + expense + "\n💰 शेष बैलेंस: ₹" + balance + " | कुल एंट्रीज: " + count);

                  if (query.isEmpty() || rawRecords.equals("अभी कोई रिकॉर्ड मौजूद नहीं है।")) {
                      txtRecords.setText(rawRecords);
                      return;
                  }

                  StringBuilder filtered = new StringBuilder();
                  String[] items = rawRecords.split("\n\n");
                  for (String item : items) {
                      if (item.toLowerCase().contains(query.toLowerCase())) {
                          filtered.append(item).append("\n\n");
                      }
                  }

                  if (filtered.length() == 0) {
                      txtRecords.setText("'" + query + "' के लिए कोई रिकॉर्ड नहीं मिला।");
                  } else {
                      txtRecords.setText(filtered.toString());
                  }
              }

              private void sharePhotoFile(File file, String caption, String itemType) {
                  if (file == null || !file.exists()) {
                      Toast.makeText(this, "पहले सदस्य की सेवा दर्ज करें ताकि " + itemType + " बन सके!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  try {
                      Uri imageUri = Uri.parse("content://com.baalsewaksabha.app.provider/" + file.getName());
                      Intent shareIntent = new Intent(Intent.ACTION_SEND);
                      shareIntent.setType("image/png");
                      shareIntent.putExtra(Intent.EXTRA_STREAM, imageUri);
                      shareIntent.putExtra(Intent.EXTRA_TEXT, caption);
                      shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(shareIntent, itemType + " शेयर करें (WhatsApp)"));
                  } catch (Exception e) {
                      Toast.makeText(this, itemType + " शेयर करने में समस्या आई!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void sendDirectWhatsappToMember() {
                  String phone = etMemberPhone.getText().toString().trim().replaceAll("[^0-9]", "");
                  if (phone.isEmpty()) {
                      Toast.makeText(this, "कृपया सदस्य का मोबाइल नंबर भरें!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (phone.length() == 10) {
                      phone = "91" + phone;
                  }
                  try {
                      String msg = lastReceiptCaption.isEmpty() ? "🚩 जय माता दी 🚩 बाल सेवक सभा अमृतसर" : lastReceiptCaption;
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setData(Uri.parse("https://api.whatsapp.com/send?phone=" + phone + "&text=" + Uri.encode(msg)));
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "व्हाट्सएप खोलने में समस्या आई!", Toast.LENGTH_SHORT).show();
                  }
              }

