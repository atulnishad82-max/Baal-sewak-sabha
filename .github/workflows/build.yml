            TopAppBar(
                title = { Text("बाल सेवक सभा", fontWeight = FontWeight.Bold) },
                colors = TopAppBarDefaults.topAppBarColors(
                    containerColor = DevotionalSaffron,
                    titleContentColor = Color.White
                )
            )
        },
        containerColor = SoftBackground
    ) { padding ->
        val dashboardItems = listOf(
            Triple("मासिक सेवा व रसीद", Icons.Default.ReceiptLong, "monthly_sewa"),
            Triple("रसीद रिकॉर्ड सूची", Icons.Default.HistoryEdu, "receipt_list"),
            Triple("सदस्य पंजीकरण", Icons.Default.PersonAdd, "member_reg"),
            Triple("सदस्य सूची", Icons.Default.People, "member_list"),
            Triple("जागरण / आयोजन", Icons.Default.Event, "jagran_reg"),
            Triple("सेवा पंजीकरण", Icons.Default.VolunteerActivism, "sewa_reg"),
            Triple("सहयोग / दान", Icons.Default.AccountBalance, "donation"),
            Triple("गैलरी", Icons.Default.PhotoLibrary, "gallery"),
            Triple("संस्था व एडमिन", Icons.Default.AdminPanelSettings, "admin_info")
        )

        LazyVerticalGrid(
            columns = GridCells.Fixed(2),
            modifier = Modifier
                .fillMaxSize()
                .padding(padding)
                .padding(12.dp),
            verticalArrangement = Arrangement.spacedBy(12.dp),
            horizontalArrangement = Arrangement.spacedBy(12.dp)
        ) {
